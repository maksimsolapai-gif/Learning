# This is a basic workflow to help you get started with Actions

name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  my_tasting:
    runs-on: ubuntu-latest

    steps:
      - name: Print Hello Massage in testing
        run: echo "Hello world from testing"

      - name: Git clone my repo
        uses: actions/checkout@v1

      - name: List curren folder
        run: ls -la
         

  my_deploy:
    runs-on: ubuntu-latest
    needs: my_tasting

    steps:
      - name: Print Hello Massage in deploy
        run: echo "Hello world from deploy"
